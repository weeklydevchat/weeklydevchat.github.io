[project]
site_name = "Weekly Dev Chat"
site_description = "Every Tuesday at 12pm Mountain Time"
site_url = "https://weeklydevchat.com"

exclude_docs = "past_topics.md"

watch = ["data"]

extra_css = [
  "stylesheets/extra.css",
  "stylesheets/page.css",
  "stylesheets/sponsors.css",
]

nav = [
  { "Home" = "index.md" },
  { "Join" = "join.md" },
  { "Hosts" = "hosts/index.md" },
  { "Past Hosts" = "past-hosts/index.md" },
  { "Sponsors" = "sponsors/index.md" },
  { "Bold Predictions 2026" = "bold-predictions-2026.md" },
  { "Tags" = "tags.md" },
]

[project.theme]
# Zensical does not use theme.name = "material".
# Use variant = "classic" if you want the Material-for-MkDocs look.
variant = "classic"
logo = "assets/logo/square_logo_light_150.webp"
favicon = "assets/logo/16X16_favicon2.webp"
features = ["navigation.indexes"]

[project.theme.palette]
primary = "teal"
accent = "blue"

[project.theme.font]
text = "Roboto"

[project.plugins.search]

[project.plugins.blog]
blog_dir = "."
pagination_per_page = 3

[project.plugins.tags]

[project.plugins.macros]
include_yaml.sponsors = "data/sponsors.yml"

[project.markdown_extensions.attr_list]